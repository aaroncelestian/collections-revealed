<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collections Revealed — Life in Salt</title>
    <link rel="stylesheet" href="/src/styles/presentation.css" />
    <link rel="stylesheet" href="/src/styles/hero-halite.css" />
  </head>
  <body>
    <div id="app" class="hero">
      <canvas id="stage-canvas" aria-hidden="true"></canvas>
      <canvas id="globe-canvas" aria-hidden="true"></canvas>

      <div id="overlay-root" class="overlay-root" aria-live="polite">
        <!-- The Searles Lake crystal. Mounts once, never unmounts. -->
        <div id="anchor-layer" class="anchor-layer is-hidden">
          <img alt="" />
        </div>

        <div id="photo-layer" class="photo-layer" hidden>
          <img id="photo-image" alt="" />
        </div>

        <div id="zoom-layer" class="zoom-layer" hidden>
          <div class="zoom-box">
            <div class="zoom-scalebar" aria-hidden="true">
              <span class="zoom-scalebar-line"></span>
              <span class="zoom-scalebar-label"></span>
            </div>
          </div>
        </div>

        <div id="diagram-layer" class="diagram-layer" hidden></div>

        <div id="compare-layer" class="compare-layer" hidden>
          <img class="compare-before" alt="" />
          <img class="compare-after" alt="" />
          <p class="compare-caption"></p>
        </div>

        <div id="video-layer" class="video-layer" hidden>
          <video
            id="beat-video"
            playsinline
            loop
            muted
            preload="auto"
            aria-label="Microbes moving inside salt"
          ></video>
          <div id="youtube-frame" class="youtube-frame" hidden></div>
          <p id="video-captions" class="video-captions" aria-hidden="true"></p>
        </div>

        <div id="beat-copy" class="beat-copy" hidden></div>
        <div id="beat-labels" class="beat-labels" hidden></div>

        <div id="depth-readout" class="depth-readout" hidden aria-hidden="true">
          <span class="depth-value">0</span>
          <span class="depth-unit">metres down</span>
        </div>

        <div id="countdown-layer" class="countdown-layer" hidden aria-hidden="true">
          <span class="countdown-number"></span>
        </div>

        <div id="reveal-flash" class="reveal-flash" aria-hidden="true"></div>
        <div id="scene-fade" class="scene-fade" aria-hidden="true"></div>

        <div id="fallback-layer" class="fallback-layer" hidden>
          <img id="fallback-image" alt="" />
          <p id="fallback-copy" class="fallback-copy"></p>
        </div>
      </div>

      <aside id="presenter-hud" class="presenter-hud" aria-label="Presenter readout">
        <div class="hud-row">
          <span id="hud-clock" class="hud-clock">0:00</span>
          <span id="hud-drift" class="hud-drift">on pace</span>
        </div>
        <span id="hud-beat">Beat 1 of 18</span>
        <span id="hud-title">Cold Open</span>
        <span id="hud-cue" class="hud-cue"></span>
        <span id="hud-ask" class="hud-ask" hidden></span>
        <span id="hud-hint">Space next · ← back · 1–7 acts · T timer · H hud · F fallback</span>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
