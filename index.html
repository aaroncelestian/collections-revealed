<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collections Revealed — Life in Salt</title>
    <link rel="stylesheet" href="/src/styles/presentation.css" />
    <link rel="stylesheet" href="/src/styles/hero-halite.css" />
  </head>
  <body>
    <div id="app" class="hero">
      <canvas id="stage-canvas" aria-hidden="true"></canvas>

      <div id="overlay-root" class="overlay-root" aria-live="polite">
        <div id="beat-copy" class="beat-copy" hidden></div>
        <div id="beat-labels" class="beat-labels" hidden></div>
        <div id="photo-layer" class="photo-layer" hidden>
          <img id="photo-image" alt="" />
        </div>
        <div id="video-layer" class="video-layer" hidden>
          <video
            id="bacteria-video"
            playsinline
            loop
            muted
            preload="auto"
            aria-label="Microbes moving inside salt"
          ></video>
          <div id="youtube-frame" class="youtube-frame" hidden></div>
          <p id="video-captions" class="video-captions" aria-hidden="true"></p>
        </div>
        <div id="fallback-layer" class="fallback-layer" hidden>
          <img id="fallback-image" alt="" />
          <p id="fallback-copy" class="fallback-copy"></p>
        </div>
      </div>

      <aside id="presenter-hud" class="presenter-hud" aria-label="Presenter readout">
        <span id="hud-beat">Beat 1</span>
        <span id="hud-title">Cold Open</span>
        <span id="hud-hint">Space / → next · ← back · 1–9 / 0 jump</span>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
